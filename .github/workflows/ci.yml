name: ci

on:
  push:
    branches: [main, cursor-interactable-branch]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci_throwaway_only # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway container that exists only for this job. Never a Neon URL.
      TEST_DATABASE_URL: "host=localhost port=5432 user=postgres password=ci_throwaway_only dbname=postgres" # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-national.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      # Scope (national-rebuild code only) comes from pyproject.toml. The frozen
      # Wisconsin baseline is deliberately not linted.
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        if: hashFiles('src/connectors/__init__.py') != ''
        run: mypy

      - name: Tests (Wisconsin baseline + national rebuild)
        run: python -m pytest

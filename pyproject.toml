# Tool configuration only. This is not a packaged project: modules are still run
# as `python -m src.<module>` from the repo root, exactly as before.
#
# Lint and type-check scope is the national-rebuild code. The Wisconsin baseline
# (src/*.py, app/, existing tests) is frozen and deliberately not covered.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a throwaway PostGIS database (TEST_DATABASE_URL); skipped when unset",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
    "src/connectors/**/*.py",
    "db/**/*.py",
    "tests/connectors/**/*.py",
    "tests/db/**/*.py",
    "tests/test_forbidden_names.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and hard-coded throwaway values by design.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
files = ["src/connectors", "db"]
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
